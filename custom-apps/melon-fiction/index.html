<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>吃瓜文学</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --line: rgba(0,0,0,.07);
    --ink: #26221d; --sub: #8a857d; --acc: #2e9e5b; --acc-soft: #e4f4ea;
    --pink: #f06e9c; --pink-soft: #fbdbe8;
    --safe-top: var(--ai-phone-app-safe-top, 76px);
    --safe-bottom: var(--ai-phone-app-safe-bottom, 20px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  button, input, textarea, select { font: inherit; outline: none; }
  button { cursor: pointer; min-height: 44px; }
  .hidden { display: none !important; }

  /* ═══ 通用视图外壳 ═══ */
  .view { min-height: 100dvh; padding: var(--safe-top) 16px var(--safe-bottom); max-width: 560px; margin: 0 auto; }

  /* ═══ 首页 ═══ */
  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .brand h1 { font-size: 26px; font-weight: 800; }
  .brand span { color: var(--sub); font-size: 12.5px; }
  .home-hint { color: var(--sub); font-size: 13px; margin-bottom: 16px; }
  .btn { border: 0; border-radius: 14px; background: var(--acc); color: #fff; font-size: 15px; font-weight: 700; padding: 12px 18px; }
  .btn:disabled { opacity: .45; }
  .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.block { display: block; width: 100%; }
  .melon-list { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .melon-item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; }
  .melon-item .info { flex: 1; min-width: 0; }
  .melon-item .t { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .melon-item .m { color: var(--sub); font-size: 12px; margin-top: 3px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px; margin-right: 6px; vertical-align: 1px; }
  .tag.forum { background: var(--acc-soft); color: var(--acc); }
  .tag.chat { background: #fdf3d8; color: #c08a1f; }
  .melon-item .del { border: 0; background: none; color: var(--sub); font-size: 12px; padding: 8px; flex-shrink: 0; }
  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 46px 0; }

  /* ═══ 新瓜设置 ═══ */
  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .topbar .back { border: 0; background: none; font-size: 22px; color: var(--ink); padding: 4px 10px 4px 0; min-height: 0; }
  .topbar h2 { font-size: 19px; font-weight: 800; }
  .field { margin-bottom: 18px; }
  .field > label { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 8px; }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--sub); font-size: 14px; font-weight: 700; padding: 9px 0; border-radius: 999px; min-height: 0; }
  .seg button.on { background: var(--ink); color: #fff; }
  .char-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .char-chip { display: flex; align-items: center; gap: 7px; background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 6px; min-height: 0; color: var(--ink); }
  .char-chip.on { border-color: var(--acc); background: var(--acc-soft); }
  .char-chip .ava { width: 30px; height: 30px; border-radius: 50%; background: #d9d4cc; color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .char-chip .ava img { width: 100%; height: 100%; object-fit: cover; }
  .char-chip .ord { font-size: 11px; color: var(--acc); font-weight: 800; }
  .role-hint { color: var(--sub); font-size: 12px; line-height: 1.7; margin-top: 8px; }
  textarea.theme { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 14px; resize: none; color: var(--ink); }

  /* ═══ 加载遮罩 ═══ */
  #busy { position: fixed; inset: 0; background: rgba(250,249,246,.82); backdrop-filter: blur(3px); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #busy .melon { font-size: 44px; animation: bob 1.1s ease-in-out infinite; }
  #busy p { color: var(--sub); font-size: 13.5px; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-9px) rotate(8deg); } }

  /* ═══ 论坛体阅读器 ═══ */
  #viewForum { background: #fff; max-width: none; padding: 0; }
  .forum-wrap { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  .forum-head { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); padding: var(--safe-top) 16px 10px; border-bottom: 1px solid var(--line); }
  .forum-head .row1 { display: flex; align-items: center; gap: 6px; }
  .forum-head .back { border: 0; background: none; font-size: 22px; padding: 2px 10px 2px 0; min-height: 0; }
  .forum-head h2 { flex: 1; font-size: 16.5px; font-weight: 800; line-height: 1.4; }
  .forum-body { flex: 1; }
  .floor { padding: 16px 16px 14px; border-bottom: 8px solid #f4f5f6; }
  .floor .fh { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .floor .fn { color: #6b6f76; font-size: 16px; }
  .badge-op { background: var(--pink-soft); color: var(--pink); font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
  .badge-me { background: #dbe9fb; color: #3d7edb; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
  .floor .quote { background: #f4f5f6; border-radius: 10px; padding: 10px 12px; color: #85878c; font-size: 14.5px; margin-bottom: 10px; overflow: hidden; }
  .floor .txt { font-size: 16.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .floor .like { display: flex; align-items: center; gap: 7px; color: #85878c; font-size: 14px; margin-top: 12px; }
  .floor .like svg { width: 19px; height: 19px; }
  .forum-foot { position: sticky; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-top: 1px solid var(--line); padding: 10px 14px calc(var(--safe-bottom) + 4px); display: flex; flex-direction: column; gap: 8px; }
  .forum-foot .rowa { display: flex; gap: 8px; }
  .forum-foot input { flex: 1; min-width: 0; background: #f4f5f6; border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; font-size: 14px; }
  .forum-foot .send { border: 0; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 700; padding: 0 18px; }
  .forum-foot .more { border: 0; border-radius: 999px; background: var(--acc); color: #fff; font-size: 14.5px; font-weight: 700; padding: 11px 0; width: 100%; }

  /* ═══ 聊天体阅读器 ═══ */
  #viewChat { background: #a6b4c8; max-width: none; padding: 0; }
  .chat-wrap { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  .chat-head { position: sticky; top: 0; z-index: 5; background: rgba(166,180,200,.96); backdrop-filter: blur(6px); padding: var(--safe-top) 14px 10px; display: flex; align-items: center; }
  .chat-head .back { border: 0; background: none; font-size: 22px; color: #23272e; padding: 2px 10px 2px 0; min-height: 0; }
  .chat-head h2 { flex: 1; text-align: center; font-size: 17px; font-weight: 700; color: #23272e; padding-right: 32px; }
  .chat-body { flex: 1; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 14px; }
  .m-row { display: flex; align-items: flex-start; gap: 9px; }
  .m-row.R { flex-direction: row-reverse; }
  .m-ava { width: 40px; height: 40px; border-radius: 9px; background: #7f93ad; color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .m-ava img { width: 100%; height: 100%; object-fit: cover; }
  .m-col { max-width: 74%; display: flex; flex-direction: column; }
  .m-row.R .m-col { align-items: flex-end; }
  .m-name { font-size: 12px; color: #4d596b; margin: 0 0 4px 4px; }
  .bubble { border-radius: 10px; padding: 9px 13px; font-size: 16px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; width: fit-content; }
  .m-row.L .bubble { background: #fff; color: #23272e; border-top-left-radius: 3px; }
  .m-row.R .bubble { background: #f9e94e; color: #23272e; border-top-right-radius: 3px; }
  .m-time { text-align: center; color: #5d6b80; font-size: 12px; margin: 2px 0; }
  .chat-foot { position: sticky; bottom: 0; background: rgba(166,180,200,.96); backdrop-filter: blur(6px); padding: 10px 14px calc(var(--safe-bottom) + 4px); }
  .chat-foot .more { border: 0; border-radius: 999px; background: #23272e; color: #fff; font-size: 14.5px; font-weight: 700; padding: 12px 0; width: 100%; }
</style>
</head>
<body>

<!-- ═══ 首页：瓜棚 ═══ -->
<div class="view" id="viewHome">
  <div class="brand"><h1>吃瓜文学</h1><span>你负责围观，瓜自己会长</span></div>
  <p class="home-hint">选几位角色当主角，生成论坛吃瓜帖或「捡到手机」聊天记录。你是屏幕外的路人，蹲后续就行。</p>
  <button class="btn block" id="btnNew">🍉 种一个新瓜</button>
  <div class="melon-list" id="melonList"></div>
</div>

<!-- ═══ 新瓜设置 ═══ -->
<div class="view hidden" id="viewSetup">
  <div class="topbar"><button class="back" id="btnSetupBack">‹</button><h2>种瓜</h2></div>
  <div class="field">
    <label>文学类型</label>
    <div class="seg">
      <button id="segForum" class="on">论坛体</button>
      <button id="segChat">聊天记录体</button>
    </div>
    <p class="role-hint" id="typeHint"></p>
  </div>
  <div class="field">
    <label>主角（点选，按顺序生效）</label>
    <div class="char-grid" id="charGrid"></div>
    <p class="role-hint" id="roleHint"></p>
  </div>
  <div class="field">
    <label>瓜的主题 / 梗概（可选）</label>
    <textarea class="theme" id="themeInput" rows="3" placeholder="不填的话，交给角色自由发挥——TA会挑一件最有戏的事"></textarea>
  </div>
  <button class="btn block" id="btnStart">开始吃瓜</button>
</div>

<!-- ═══ 论坛体阅读器 ═══ -->
<div class="view hidden" id="viewForum">
  <div class="forum-wrap">
    <div class="forum-head">
      <div class="row1"><button class="back" id="btnForumBack">‹</button><h2 id="forumTitle"></h2></div>
    </div>
    <div class="forum-body" id="forumBody"></div>
    <div class="forum-foot">
      <div class="rowa">
        <input id="floorInput" maxlength="200" placeholder="以路人身份插一楼…" />
        <button class="send" id="btnFloorSend">盖楼</button>
      </div>
      <button class="more" id="btnForumMore">蹲后续 · 催更</button>
    </div>
  </div>
</div>

<!-- ═══ 聊天体阅读器 ═══ -->
<div class="view hidden" id="viewChat">
  <div class="chat-wrap">
    <div class="chat-head"><button class="back" id="btnChatBack">‹</button><h2 id="chatTitle"></h2></div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-foot"><button class="more" id="btnChatMore">继续往下翻 ›</button></div>
  </div>
</div>

<div id="busy" class="hidden"><div class="melon">🍉</div><p id="busyText">瓜正在长大…</p></div>

<script>
(function () {
  var api = window.AiPhone;
  var COLL = "melons";
  var characters = [];          // [{id,name,avatar}]
  var melons = [];              // 本地缓存的 db 记录
  var current = null;           // 正在阅读的瓜
  var setupType = "forum";
  var picked = [];              // 选中的角色 id，按点选顺序

  var $ = function (id) { return document.getElementById(id); };
  var THUMB_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3zm0 0l4.2-7.1a1.6 1.6 0 0 1 2.9 1L13 10h6.2a2 2 0 0 1 2 2.4l-1.3 6.4a2.5 2.5 0 0 1-2.5 2.2H7"/></svg>';

  function toast(text) { try { api.ui.toast(text); } catch (e) { /* 没权限也别崩 */ } }
  function busy(on, text) {
    $("busyText").textContent = text || "瓜正在长大…";
    $("busy").classList.toggle("hidden", !on);
  }
  function show(id) {
    ["viewHome", "viewSetup", "viewForum", "viewChat"].forEach(function (v) {
      $(v).classList.toggle("hidden", v !== id);
    });
    window.scrollTo(0, 0);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function charById(id) {
    for (var i = 0; i < characters.length; i++) if (characters[i].id === id) return characters[i];
    return null;
  }
  function avatarHtml(id, name) {
    var ch = id ? charById(id) : null;
    if (ch && ch.avatar) return '<img src="' + esc(ch.avatar) + '" alt="" />';
    return esc((name || "?").trim().charAt(0) || "?");
  }
  function fmtLike(v) {
    var s = String(v == null ? "" : v).trim();
    if (!s) return "";
    var n = Number(s);
    if (isFinite(n) && n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "万";
    return s;
  }

  /* ─────────── 解析器 ─────────── */

  function parseAttrs(line) {
    var out = {};
    var re = /([一-龥\w]+)\s*=\s*([^\s]+)/g, m;
    while ((m = re.exec(line))) out[m[1]] = m[2];
    return out;
  }

  // 论坛体：@标题 / @楼 层= 谁= 赞= 引用=
  function parseForum(text, startFloor) {
    var lines = String(text || "").split(/\r?\n/);
    var title = null, floors = [], cur = null;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      var tm = line.match(/^@\s*标题[:：\s]*(.+)$/);
      if (tm) { title = tm[1].trim(); continue; }
      var fm = line.match(/^@\s*楼(?=\s|$)(.*)$/);
      if (fm) {
        if (cur && cur.text) floors.push(cur);
        var a = parseAttrs(fm[1]);
        cur = {
          who: (a["谁"] || "").indexOf("楼主") >= 0 ? "op" : "crowd",
          like: a["赞"] || "",
          quote: parseInt(a["引用"], 10) || 0,
          text: ""
        };
        continue;
      }
      if (cur) cur.text += (cur.text ? "\n" : "") + lines[i].replace(/\s+$/, "");
    }
    if (cur && cur.text) floors.push(cur);
    for (var j = 0; j < floors.length; j++) {
      floors[j].n = startFloor + j;
      floors[j].text = floors[j].text.trim();
    }
    return { title: title, floors: floors };
  }

  // 聊天体：@备注 / @右 / @左 / @时间
  function parseChat(text) {
    var lines = String(text || "").split(/\r?\n/);
    var remark = null, msgs = [], last = null;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var rm = line.match(/^@\s*备注[:：\s]*(.+)$/);
      if (rm) { remark = rm[1].trim(); continue; }
      var mm = line.match(/^@\s*(右|左|时间)[:：\s]*(.*)$/);
      if (mm) {
        last = { k: mm[1] === "右" ? "R" : mm[1] === "左" ? "L" : "t", text: mm[2].trim() };
        msgs.push(last);
        continue;
      }
      if (last && last.k !== "t") last.text += "\n" + line;   // 罕见的跨行消息
    }
    return { remark: remark, msgs: msgs };
  }

  /* ─────────── 数据 ─────────── */

  function saveCurrent() {
    current.updatedAt = new Date().toISOString();
    return api.db.update(COLL, current.id, current).catch(function (e) {
      toast("保存失败：" + (e && e.message || e));
    });
  }

  function loadAll() {
    return Promise.all([
      api.characters.list(),
      api.db.list(COLL, { limit: 100 })
    ]).then(function (r) {
      characters = r[0] || [];
      melons = (r[1] || []).sort(function (a, b) {
        return String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""));
      });
    });
  }

  /* ─────────── 首页 ─────────── */

  function renderHome() {
    var box = $("melonList");
    if (!melons.length) {
      box.innerHTML = '<div class="empty">瓜棚空空如也，种一个吧</div>';
      return;
    }
    box.innerHTML = "";
    melons.forEach(function (m) {
      var item = document.createElement("div");
      item.className = "melon-item";
      var count = m.type === "forum" ? ((m.floors || []).length + "楼") : ((m.msgs || []).length + "条");
      item.innerHTML =
        '<div class="info"><div class="t">' + esc(m.title || m.remark || "无标题瓜") + '</div>' +
        '<div class="m"><span class="tag ' + (m.type === "forum" ? "forum" : "chat") + '">' +
        (m.type === "forum" ? "论坛体" : "聊天体") + "</span>" +
        esc((m.charNames || []).join("、")) + " · " + count + "</div></div>" +
        '<button class="del">删除</button>';
      item.querySelector(".info").addEventListener("click", function () { openMelon(m); });
      item.querySelector(".del").addEventListener("click", function () {
        api.ui.confirm({ title: "扔掉这个瓜？", message: "删除后不可恢复。" }).then(function (ok) {
          if (!ok) return;
          api.db.delete(COLL, m.id).then(function () {
            melons = melons.filter(function (x) { return x.id !== m.id; });
            renderHome();
          });
        });
      });
      box.appendChild(item);
    });
  }

  /* ─────────── 新瓜设置 ─────────── */

  function renderSetup() {
    $("segForum").classList.toggle("on", setupType === "forum");
    $("segChat").classList.toggle("on", setupType === "chat");
    $("typeHint").textContent = setupType === "forum"
      ? "主角以匿名网友身份发帖，楼下全是吃瓜群众。"
      : "偷看一部「捡到的手机」里的私聊记录。";
    var grid = $("charGrid");
    grid.innerHTML = "";
    if (!characters.length) {
      grid.innerHTML = '<div class="empty" style="padding:10px 0">还没有角色，先去创建一个角色卡吧</div>';
    }
    characters.forEach(function (ch) {
      var idx = picked.indexOf(ch.id);
      var chip = document.createElement("button");
      chip.className = "char-chip" + (idx >= 0 ? " on" : "");
      chip.innerHTML = '<span class="ava">' + avatarHtml(ch.id, ch.name) + "</span>" +
        esc(ch.name) + (idx >= 0 ? ' <span class="ord">' + (idx + 1) + "</span>" : "");
      chip.addEventListener("click", function () {
        var i = picked.indexOf(ch.id);
        if (i >= 0) picked.splice(i, 1);
        else if (picked.length >= 3) { toast("最多选 3 位主角"); return; }
        else picked.push(ch.id);
        renderSetup();
      });
      grid.appendChild(chip);
    });
    $("roleHint").textContent = setupType === "chat"
      ? "聊天体：只选 1 位 → TA是对方（左侧白气泡），手机主人由AI虚构；选 2 位 → 第1位是手机主人（右侧黄气泡），第2位是对方。"
      : "论坛体：第 1 位是楼主；多选的角色会作为知情人或当事人被卷进这个瓜。";
  }

  /* ─────────── 生成 ─────────── */

  function genArgs(instruction) {
    var args = {
      appTags: ["melon", current.type],
      instruction: instruction,
      messages: (current.turns || []).slice(-20)
    };
    if (current.characterIds.length > 1) args.characterIds = current.characterIds;
    else args.characterId = current.characterIds[0];
    return args;
  }

  function pushTurn(role, content) {
    current.turns = current.turns || [];
    current.turns.push({ role: role, content: content, createdAt: new Date().toISOString() });
  }

  function kickoffInstruction() {
    var names = current.charNames;
    var theme = current.theme
      ? "这个瓜的主题/梗概：" + current.theme
      : "瓜的内容由你根据主角的性格、近况和记忆自由发挥，挑一件最有戏剧张力的事。";
    if (current.type === "forum") {
      var cast = "楼主是：" + names[0] + "。";
      if (names.length > 1) cast += "其他主角（" + names.slice(1).join("、") + "）作为当事人或知情人被卷进这个瓜，可以被楼主提到，也可以疑似潜水出没在楼层里。";
      return cast + "\n" + theme + "\n请开一个新帖：先输出@标题，然后生成第1楼（楼主首帖）到第12楼左右，楼主中途要下场回复至少一次。";
    }
    var cast2 = names.length >= 2
      ? "右侧（手机主人）是：" + names[0] + "；左侧（对方）是：" + names[1] + "。"
      : "左侧（对方）是：" + names[0] + "；右侧的手机主人是TA亲近的一个联系人，由你根据TA的人际关系虚构（不能是屏幕外的用户）。";
    return cast2 + "\n" + theme + "\n请生成这段聊天记录的开头：先输出@备注（手机主人给对方的备注名，可以有梗），然后生成15~25条消息。";
  }

  function continueInstruction() {
    if (current.type === "forum") {
      var next = (current.floors.length ? current.floors[current.floors.length - 1].n : 0) + 1;
      return "继续更新这个帖子：从第" + next + "楼开始，再生成8~12层楼，推进瓜的进展（楼主回复、新爆料、反转或新钩子都行）。" +
        "如果楼层里出现了标注为吃瓜群众插的楼，让楼主或网友自然接住它。不要重复已有楼层，不要再输出@标题。";
    }
    return "继续往下翻这段聊天记录：再生成15~25条消息，自然衔接前文，可以插@时间表示时间流逝。不要重复已有消息，不要再输出@备注。";
  }

  function generate(instruction, isFirst) {
    busy(true, isFirst ? "瓜正在种下…" : "瓜正在长大…");
    return api.ai.generate(genArgs(instruction)).then(function (result) {
      var text = result && result.text || "";
      pushTurn("user", instruction);
      pushTurn("assistant", text);
      if (current.type === "forum") {
        var start = (current.floors.length ? current.floors[current.floors.length - 1].n : 0) + 1;
        var parsed = parseForum(text, start);
        if (parsed.title && !current.title) current.title = parsed.title;
        if (!parsed.floors.length) {
          toast("这一茬瓜格式有点歪，已按原文展示");
          parsed.floors = [{ n: start, who: "crowd", like: "", quote: 0, text: text.trim() }];
        }
        current.floors = current.floors.concat(parsed.floors);
      } else {
        var parsedC = parseChat(text);
        if (parsedC.remark && !current.remark) current.remark = parsedC.remark;
        if (!parsedC.msgs.length) {
          toast("这一段格式有点歪，已按原文展示");
          parsedC.msgs = [{ k: "L", text: text.trim() }];
        }
        current.msgs = current.msgs.concat(parsedC.msgs);
      }
      return saveCurrent();
    }).then(function () {
      busy(false);
      renderReader(!isFirst);
    }).catch(function (e) {
      busy(false);
      toast("生成失败：" + (e && e.message || e));
    });
  }

  function startMelon() {
    if (!picked.length) { toast("先选至少一位主角"); return; }
    if (setupType === "chat" && picked.length > 2) { toast("聊天体最多选 2 位"); return; }
    var names = picked.map(function (id) { var c = charById(id); return c ? c.name : "?"; });
    var record = {
      type: setupType,
      title: "",
      remark: "",
      characterIds: picked.slice(),
      charNames: names,
      theme: $("themeInput").value.trim(),
      floors: [],
      msgs: [],
      turns: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    busy(true, "瓜正在种下…");
    api.db.create(COLL, record).then(function (created) {
      current = created;
      melons.unshift(created);
      return generate(kickoffInstruction(), true);
    }).catch(function (e) {
      busy(false);
      toast("创建失败：" + (e && e.message || e));
    });
  }

  function openMelon(m) {
    current = m;
    renderReader(false);
  }

  /* ─────────── 阅读器渲染 ─────────── */

  function renderReader(keepScroll) {
    var prevScroll = keepScroll ? window.scrollY : 0;
    if (current.type === "forum") {
      show("viewForum");
      $("forumTitle").textContent = current.title || "无标题瓜";
      var body = $("forumBody");
      body.innerHTML = "";
      var byN = {};
      current.floors.forEach(function (f) { byN[f.n] = f; });
      current.floors.forEach(function (f) {
        var el = document.createElement("div");
        el.className = "floor";
        var head = '<div class="fh"><span class="fn">' + f.n + "楼</span>";
        if (f.who === "op") head += '<span class="badge-op">楼主</span>';
        if (f.who === "me") head += '<span class="badge-me">吃瓜群众（你）</span>';
        head += "</div>";
        var quote = "";
        if (f.quote && byN[f.quote]) {
          var q = byN[f.quote];
          var qt = q.text.replace(/\s+/g, " ");
          if (qt.length > 48) qt = qt.slice(0, 48) + "…";
          quote = '<div class="quote">' + q.n + "楼" + (q.who === "op" ? "（楼主）" : "") + "：" + esc(qt) + "</div>";
        }
        var like = f.who === "me" ? "" :
          '<div class="like">' + THUMB_SVG + "<span>" + esc(fmtLike(f.like)) + "</span></div>";
        el.innerHTML = head + quote + '<div class="txt">' + esc(f.text) + "</div>" + like;
        body.appendChild(el);
      });
    } else {
      show("viewChat");
      $("chatTitle").textContent = current.remark || current.charNames.join("、");
      var cbody = $("chatBody");
      cbody.innerHTML = "";
      var otherId = current.characterIds.length >= 2 ? current.characterIds[1] : current.characterIds[0];
      var otherName = current.remark || (current.characterIds.length >= 2 ? current.charNames[1] : current.charNames[0]);
      current.msgs.forEach(function (m) {
        if (m.k === "t") {
          var t = document.createElement("div");
          t.className = "m-time";
          t.textContent = m.text;
          cbody.appendChild(t);
          return;
        }
        var row = document.createElement("div");
        row.className = "m-row " + m.k;
        if (m.k === "L") {
          row.innerHTML = '<div class="m-ava">' + avatarHtml(otherId, otherName) + "</div>" +
            '<div class="m-col"><div class="m-name">' + esc(otherName) + '</div><div class="bubble">' + esc(m.text) + "</div></div>";
        } else {
          row.innerHTML = '<div class="m-col"><div class="bubble">' + esc(m.text) + "</div></div>";
        }
        cbody.appendChild(row);
      });
    }
    if (keepScroll) window.scrollTo(0, prevScroll);
    else window.scrollTo(0, 0);
  }

  /* ─────────── 事件绑定 ─────────── */

  $("btnNew").addEventListener("click", function () {
    picked = [];
    $("themeInput").value = "";
    renderSetup();
    show("viewSetup");
  });
  $("btnSetupBack").addEventListener("click", function () { renderHome(); show("viewHome"); });
  $("segForum").addEventListener("click", function () { setupType = "forum"; renderSetup(); });
  $("segChat").addEventListener("click", function () { setupType = "chat"; renderSetup(); });
  $("btnStart").addEventListener("click", startMelon);

  $("btnForumBack").addEventListener("click", function () { renderHome(); show("viewHome"); });
  $("btnChatBack").addEventListener("click", function () { renderHome(); show("viewHome"); });

  $("btnForumMore").addEventListener("click", function () { generate(continueInstruction(), false); });
  $("btnChatMore").addEventListener("click", function () { generate(continueInstruction(), false); });

  $("btnFloorSend").addEventListener("click", function () {
    var text = $("floorInput").value.trim();
    if (!text) return;
    var n = (current.floors.length ? current.floors[current.floors.length - 1].n : 0) + 1;
    current.floors.push({ n: n, who: "me", like: "", quote: 0, text: text });
    pushTurn("user", "[插楼] 屏幕外的一位吃瓜群众在第" + n + "楼盖了一层：" + text + "\n（这层楼已经显示在帖子里，后续楼层可以引用第" + n + "楼回应TA。）");
    $("floorInput").value = "";
    saveCurrent().then(function () { renderReader(true); });
  });

  /* ─────────── 启动 ─────────── */

  busy(true, "搬小板凳中…");
  loadAll().then(function () {
    busy(false);
    renderHome();
    show("viewHome");
  }).catch(function (e) {
    busy(false);
    renderHome();
    show("viewHome");
    toast("加载失败：" + (e && e.message || e));
  });
})();
</script>
</body>
</html>
